name: Keep Bot Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot health check
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔄 Проверка статуса бота..."
          echo "⏰ Время: $(date '+%Y-%m-%d %H:%M:%S')"
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://insta-bot-2-nv7k.onrender.com/health)
          
          if [ $HTTP_CODE -eq 200 ]; then
            echo "✅ Бот активен! (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Бот не отвечает! (HTTP $HTTP_CODE)"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
